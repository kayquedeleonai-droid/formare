<title>Ateliê de Argila</title>
<meta name="description" content="Protótipo de escultura digital com sensação de argila real.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a full-bleed workshop stage, with tools floating at the edges like a sculptor's bench. */
:root{
  --bg:#1a1714;
  --bg-deep:#110f0d;
  --panel:rgba(36,32,28,.86);
  --panel-solid:#25211d;
  --line:rgba(236,226,210,.10);
  --fg:#ede5d8;
  --muted:#a1968a;
  --accent:#d39a62;
  --accent-ink:#1a1714;
  --f-display:"Young Serif", Georgia, "Times New Roman", serif;
  --f-ui:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:"JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--f-ui)}
#stage{position:fixed;inset:0;background:radial-gradient(120% 90% at 50% 30%, #2b2620 0%, var(--bg) 55%, var(--bg-deep) 100%)}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
.panel{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.brand{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:calc(16px + env(safe-area-inset-left,0px));pointer-events:none;display:flex;flex-direction:column;gap:2px}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;letter-spacing:.01em}
.brand p{margin:0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

.rail{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px;padding:6px}
.tool{position:relative;width:52px;height:52px;border:0;background:transparent;border-radius:10px;display:grid;place-items:center;cursor:pointer;color:var(--muted);transition:background .15s,color .15s}
.tool:hover{background:rgba(236,226,210,.06);color:var(--fg)}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tool svg{width:26px;height:26px}
.tool .key{position:absolute;right:5px;bottom:3px;font-family:var(--f-num);font-size:9px;opacity:.6}
.tip{position:absolute;left:62px;top:50%;transform:translateY(-50%);white-space:nowrap;background:var(--panel-solid);border:1px solid var(--line);padding:6px 10px;border-radius:8px;font-size:12px;color:var(--fg);pointer-events:none;opacity:0;transition:opacity .12s}
.tip b{display:block;font-weight:600}
.tip span{color:var(--muted)}
.tool:hover .tip{opacity:1}

.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(600px, calc(100% - 32px));display:flex;gap:18px;align-items:center;padding:12px 16px;box-sizing:border-box}
.field{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.field output{font-family:var(--f-num);letter-spacing:0;color:var(--fg);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--accent) var(--p,50%),rgba(236,226,210,.16) var(--p,50%))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(236,226,210,.16)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--fg);margin-top:-6px;border:0;box-shadow:0 1px 4px rgba(0,0,0,.4)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--fg);border:0}
.pressure{width:46px;display:flex;flex-direction:column;gap:6px;align-items:center}
.pressure small{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pmeter{width:8px;height:28px;border-radius:4px;background:rgba(236,226,210,.12);position:relative;overflow:hidden}
.pmeter i{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--accent);transition:height .06s}

.side{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));top:calc(16px + env(safe-area-inset-top,0px));width:250px;padding:16px;display:flex;flex-direction:column;gap:18px;box-sizing:border-box;max-height:calc(100% - 32px);overflow:auto}
.side h2{margin:0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.group{display:flex;flex-direction:column;gap:10px}
.state-ticks{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.state-ticks span.on{color:var(--fg)}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sw{aspect-ratio:1;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;box-shadow:inset 0 -6px 10px rgba(0,0,0,.28)}
.sw[aria-pressed="true"]{border-color:var(--fg)}
.swname{font-size:12px;color:var(--fg)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;background:none;border:0;padding:4px 0;cursor:pointer;text-align:left}
.toggle small{display:block;color:var(--muted);font-size:11px;margin-top:1px}
.switch{flex:none;width:34px;height:20px;border-radius:10px;background:rgba(236,226,210,.16);position:relative;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--fg);transition:transform .15s}
.toggle[aria-checked="true"] .switch{background:var(--accent)}
.toggle[aria-checked="true"] .switch::after{transform:translateX(14px);background:var(--accent-ink)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:1px solid var(--line);background:rgba(236,226,210,.04);border-radius:9px;padding:9px 10px;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:rgba(236,226,210,.09)}
.btn:disabled{opacity:.4;cursor:default}
.btn.wide{grid-column:1/-1}
.kbd{font-family:var(--f-num);font-size:10px;color:var(--muted)}

.hint{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--muted);line-height:1.7;max-width:260px;pointer-events:none}
.hint b{color:var(--fg);font-weight:500}
.mode{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-50%);font-size:12px;padding:6px 12px;border-radius:20px;pointer-events:none;opacity:0;transition:opacity .2s}
.mode.show{opacity:1}
.settings-btn{display:none}
.err{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}

@media (max-width: 1100px){ .hint{display:none} }
@media (max-width: 720px){
  .brand h1{font-size:18px}
  .rail{top:auto;transform:translateX(-50%);left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));flex-direction:row;padding:4px;gap:2px}
  .tool{width:44px;height:44px}
  .tool svg{width:22px;height:22px}
  .tip{display:none}
  .bottom{gap:12px;padding:10px 12px}
  .side{display:none;top:calc(64px + env(safe-area-inset-top,0px));width:min(280px, calc(100% - 32px));max-height:calc(100% - 240px)}
  .side.open{display:flex}
  .settings-btn{display:flex;position:fixed;right:calc(16px + env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px));padding:8px 12px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>

<div id="stage"></div>

<div class="brand">
  <h1>Ateliê de Argila</h1>
  <p>Protótipo de sensação · v0.1</p>
</div>

<nav class="rail panel" id="rail" aria-label="Ferramentas"></nav>

<div class="bottom panel">
  <div class="field">
    <label for="size">Tamanho <output id="sizeOut">70 px</output></label>
    <input type="range" id="size" min="12" max="240" value="70">
  </div>
  <div class="field">
    <label for="strength">Força <output id="strOut">55%</output></label>
    <input type="range" id="strength" min="5" max="100" value="55">
  </div>
  <div class="pressure" title="Pressão da caneta">
    <div class="pmeter"><i id="pbar"></i></div>
    <small>Pressão</small>
  </div>
</div>

<button class="btn settings-btn panel" id="settingsBtn" aria-expanded="false" aria-controls="side">Ajustes</button>

<aside class="side panel" id="side">
  <div class="group">
    <h2>Estado da argila</h2>
    <input type="range" id="dry" min="0" max="100" value="18" aria-label="Estado da argila, de úmida a seca">
    <div class="state-ticks" id="ticks"><span>Úmida</span><span>Couro</span><span>Seca</span></div>
  </div>
  <div class="group">
    <h2>Argila</h2>
    <div class="swatches" id="swatches"></div>
    <div class="swname" id="swname"></div>
  </div>
  <div class="group">
    <button class="toggle" id="tSym" role="switch" aria-checked="true"><span>Simetria X<small>Espelha o gesto no outro lado</small></span><span class="switch"></span></button>
    <button class="toggle" id="tVol" role="switch" aria-checked="true"><span>Conservar volume<small>Material empurrado sobe nas bordas</small></span><span class="switch"></span></button>
    <button class="toggle" id="tSound" role="switch" aria-checked="true"><span>Som da argila<small>Atrito reage à velocidade e pressão</small></span><span class="switch"></span></button>
  </div>
  <div class="actions">
    <button class="btn" id="undo" disabled>Desfazer</button>
    <button class="btn" id="redo" disabled>Refazer</button>
    <button class="btn" id="newBlock">Bloco novo</button>
    <button class="btn" id="newSample">Exemplo</button>
  </div>
</aside>

<div class="hint" id="hint">
  <b>Na argila:</b> arraste para esculpir<br>
  <b>Fora dela:</b> gire a banqueta<br>
  <b>Roda:</b> aproximar · <b>Shift:</b> alisar · <b>Alt:</b> inverter<br>
  <b>[ ]</b> tamanho · <b>1–6</b> ferramentas · <b>X</b> simetria
</div>
<div class="mode panel" id="mode"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
const stage = document.getElementById('stage');
if (!window.THREE) { stage.innerHTML = '<div class="err">Não foi possível carregar o motor 3D. Recarregue a página.</div>'; return; }

/* ---------------- Ferramentas ---------------- */
const TOOLS = [
  {id:'clay',   name:'Argila',          desc:'Adiciona pelotas de barro', icon:'<path d="M5 16c2-5 5-8 9-8 3 0 5 2 5 4 0 3-3 5-7 6-3 .7-5 0-7-2z"/><circle cx="9" cy="13" r="1.2"/><circle cx="14" cy="11.5" r="1"/>', snd:[420,0.9,1.0]},
  {id:'thumb',  name:'Polegar',         desc:'Empurra o material como o dedo', icon:'<path d="M8 20v-8a2.5 2.5 0 0 1 5 0v1"/><path d="M13 13a2.5 2.5 0 0 1 5 0v3c0 3-2 5-5 5h-1c-2 0-4-1-4-3"/><path d="M4 9c2-2 4-3 7-3"/>', snd:[300,0.8,0.8]},
  {id:'smooth', name:'Alisar',          desc:'Dedo molhado sobre a superfície', icon:'<path d="M3 15c3-3 5-3 8 0s5 3 10 0"/><path d="M3 10c3-2 5-2 8 0s5 2 10 0" opacity=".45"/>', snd:[760,0.6,0.45]},
  {id:'rake',   name:'Esteca dentada',  desc:'Risca sulcos paralelos', icon:'<path d="M4 6h16"/><path d="M6 6v12M10 6v12M14 6v12M18 6v12"/>', snd:[2600,3.5,1.2]},
  {id:'carve',  name:'Laço',            desc:'Cava e deixa rebarba nas bordas', icon:'<path d="M4 20 14 10"/><path d="M14 10c0-3 2-6 4-6s2 2 2 4-3 4-6 2z"/>', snd:[1700,2.2,1.0]},
  {id:'flatten',name:'Espátula',        desc:'Achata planos', icon:'<path d="M4 20 11 13"/><path d="M11 13l6-8 3 3-8 6z"/>', snd:[520,1.0,0.7]}
];
const CLAYS = [
  {name:'Terracota',            hex:'#a65a38'},
  {name:'Plastilina cinza',     hex:'#8f8b82'},
  {name:'Barro cru',            hex:'#7b5b42'},
  {name:'Porcelana',            hex:'#e2dbcf'}
];

let tool = 'clay';
const rail = document.getElementById('rail');
TOOLS.forEach((t,i)=>{
  const b = document.createElement('button');
  b.className='tool'; b.id='tool-'+t.id; b.setAttribute('aria-pressed', t.id===tool);
  b.setAttribute('aria-label', t.name);
  b.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${t.icon}</svg><span class="key">${i+1}</span><span class="tip"><b>${t.name}</b><span>${t.desc}</span></span>`;
  b.onclick = ()=>setTool(t.id);
  rail.appendChild(b);
});
function setTool(id){ tool=id; TOOLS.forEach(t=>document.getElementById('tool-'+t.id).setAttribute('aria-pressed', t.id===id)); }

/* ---------------- Malha: icosfera densa ---------------- */
const LEVEL = 7;
function buildIcosphere(level){
  const t=(1+Math.sqrt(5))/2;
  const v=[-1,t,0, 1,t,0, -1,-t,0, 1,-t,0, 0,-1,t, 0,1,t, 0,-1,-t, 0,1,-t, t,0,-1, t,0,1, -t,0,-1, -t,0,1];
  for(let i=0;i<v.length;i+=3){const l=Math.hypot(v[i],v[i+1],v[i+2]);v[i]/=l;v[i+1]/=l;v[i+2]/=l;}
  let f=[0,11,5,0,5,1,0,1,7,0,7,10,0,10,11,1,5,9,5,11,4,11,10,2,10,7,6,7,1,8,3,9,4,3,4,2,3,2,6,3,6,8,3,8,9,4,9,5,2,4,11,6,2,10,8,6,7,9,8,1];
  for(let L=0;L<level;L++){
    const cache=new Map(); const nf=[];
    const mid=(a,b)=>{const k=a<b?a*262144+b:b*262144+a; let r=cache.get(k); if(r!==undefined) return r;
      let x=(v[a*3]+v[b*3])/2,y=(v[a*3+1]+v[b*3+1])/2,z=(v[a*3+2]+v[b*3+2])/2; const l=Math.hypot(x,y,z);
      r=v.length/3; v.push(x/l,y/l,z/l); cache.set(k,r); return r;};
    for(let i=0;i<f.length;i+=3){const a=f[i],b=f[i+1],c=f[i+2];const ab=mid(a,b),bc=mid(b,c),ca=mid(c,a);
      nf.push(a,ab,ca, b,bc,ab, c,ca,bc, ab,bc,ca);}
    f=nf;
  }
  return {pos:new Float32Array(v), idx:new Uint32Array(f)};
}
const ico = buildIcosphere(LEVEL);
const basePos = ico.pos;
const idx = ico.idx;
const nV = basePos.length/3, nF = idx.length/3;
const pos = new Float32Array(basePos);
const nor = new Float32Array(nV*3);
const cav = new Float32Array(nV);
const cavRaw = new Float32Array(nV);

// adjacência (máx. 6 por vértice numa icosfera)
const vf = new Int32Array(nV*6), vfc = new Uint8Array(nV);
for(let f=0;f<nF;f++) for(let k=0;k<3;k++){const v=idx[f*3+k]; vf[v*6+vfc[v]++]=f;}
const nb = new Int32Array(nV*6), nbc = new Uint8Array(nV);
for(let f=0;f<nF;f++){
  for(let k=0;k<3;k++){
    const a=idx[f*3+k], b=idx[f*3+(k+1)%3];
    let found=false; for(let m=0;m<nbc[a];m++) if(nb[a*6+m]===b){found=true;break;}
    if(!found && nbc[a]<6) nb[a*6+nbc[a]++]=b;
    found=false; for(let m=0;m<nbc[b];m++) if(nb[b*6+m]===a){found=true;break;}
    if(!found && nbc[b]<6) nb[b*6+nbc[b]++]=a;
  }
}
const meanEdge = (()=>{let s=0;const a=idx[0],b=idx[1];s=Math.hypot(basePos[a*3]-basePos[b*3],basePos[a*3+1]-basePos[b*3+1],basePos[a*3+2]-basePos[b*3+2]);return s;})();

function vertexNormal(v){
  let sx=0,sy=0,sz=0;
  for(let m=0;m<vfc[v];m++){
    const f=vf[v*6+m]; const a=idx[f*3]*3,b=idx[f*3+1]*3,c=idx[f*3+2]*3;
    const e1x=pos[b]-pos[a],e1y=pos[b+1]-pos[a+1],e1z=pos[b+2]-pos[a+2];
    const e2x=pos[c]-pos[a],e2y=pos[c+1]-pos[a+1],e2z=pos[c+2]-pos[a+2];
    sx+=e1y*e2z-e1z*e2y; sy+=e1z*e2x-e1x*e2z; sz+=e1x*e2y-e1y*e2x;
  }
  const l=Math.hypot(sx,sy,sz)||1; nor[v*3]=sx/l; nor[v*3+1]=sy/l; nor[v*3+2]=sz/l;
}
const CAVK = 7.0;
function vertexCavity(v){
  let ax=0,ay=0,az=0; const c=nbc[v];
  for(let m=0;m<c;m++){const u=nb[v*6+m]*3; ax+=pos[u];ay+=pos[u+1];az+=pos[u+2];}
  ax=ax/c-pos[v*3]; ay=ay/c-pos[v*3+1]; az=az/c-pos[v*3+2];
  cavRaw[v]=(ax*nor[v*3]+ay*nor[v*3+1]+az*nor[v*3+2])/meanEdge*CAVK;
}
function smoothCav(v){
  let s=0; const c=nbc[v]; for(let m=0;m<c;m++) s+=cavRaw[nb[v*6+m]];
  cav[v]=cavRaw[v]*0.4+(s/c)*0.6;
}
function recomputeAll(){
  for(let v=0;v<nV;v++) vertexNormal(v);
  for(let v=0;v<nV;v++) vertexCavity(v);
  for(let v=0;v<nV;v++) smoothCav(v);
  dirty=true;
}

/* ---------------- Grade espacial para raycast ---------------- */
const G=44; let gMin=[0,0,0], gCell=[1,1,1], gStart=null, gTris=null;
function buildGrid(){
  let mn=[1e9,1e9,1e9], mx=[-1e9,-1e9,-1e9];
  for(let i=0;i<nV*3;i+=3) for(let k=0;k<3;k++){const p=pos[i+k]; if(p<mn[k])mn[k]=p; if(p>mx[k])mx[k]=p;}
  for(let k=0;k<3;k++){const pad=(mx[k]-mn[k])*0.06+0.02; mn[k]-=pad; mx[k]+=pad; gCell[k]=(mx[k]-mn[k])/G;}
  gMin=mn;
  const counts=new Int32Array(G*G*G+1);
  const rng=new Int32Array(nF*6);
  for(let f=0;f<nF;f++){
    const a=idx[f*3]*3,b=idx[f*3+1]*3,c=idx[f*3+2]*3;
    for(let k=0;k<3;k++){
      const lo=Math.min(pos[a+k],pos[b+k],pos[c+k]), hi=Math.max(pos[a+k],pos[b+k],pos[c+k]);
      rng[f*6+k]=Math.max(0,Math.min(G-1,Math.floor((lo-mn[k])/gCell[k])));
      rng[f*6+3+k]=Math.max(0,Math.min(G-1,Math.floor((hi-mn[k])/gCell[k])));
    }
    for(let x=rng[f*6];x<=rng[f*6+3];x++)for(let y=rng[f*6+1];y<=rng[f*6+4];y++)for(let z=rng[f*6+2];z<=rng[f*6+5];z++) counts[(x*G+y)*G+z+1]++;
  }
  for(let i=1;i<counts.length;i++) counts[i]+=counts[i-1];
  const fill=counts.slice(0,G*G*G); const tris=new Int32Array(counts[G*G*G]);
  for(let f=0;f<nF;f++){
    for(let x=rng[f*6];x<=rng[f*6+3];x++)for(let y=rng[f*6+1];y<=rng[f*6+4];y++)for(let z=rng[f*6+2];z<=rng[f*6+5];z++) tris[fill[(x*G+y)*G+z]++]=f;
  }
  gStart=counts; gTris=tris;
}
function rayTri(o,d,f){
  const a=idx[f*3]*3,b=idx[f*3+1]*3,c=idx[f*3+2]*3;
  const e1x=pos[b]-pos[a],e1y=pos[b+1]-pos[a+1],e1z=pos[b+2]-pos[a+2];
  const e2x=pos[c]-pos[a],e2y=pos[c+1]-pos[a+1],e2z=pos[c+2]-pos[a+2];
  const px=d[1]*e2z-d[2]*e2y, py=d[2]*e2x-d[0]*e2z, pz=d[0]*e2y-d[1]*e2x;
  const det=e1x*px+e1y*py+e1z*pz; if(Math.abs(det)<1e-12) return -1;
  const inv=1/det; const tx=o[0]-pos[a],ty=o[1]-pos[a+1],tz=o[2]-pos[a+2];
  const u=(tx*px+ty*py+tz*pz)*inv; if(u<0||u>1) return -1;

    let b=0; for(let i=0;i<len;i++){const w=Math.random()*2-1; b=0.97*b+0.03*w; d[i]=w*0.55+b*3.0;}
    const src=actx.createBufferSource(); src.buffer=buf; src.loop=true;
    sFilt=actx.createBiquadFilter(); sFilt.type='bandpass'; sFilt.frequency.value=400; sFilt.Q.value=0.9;
    sBody=actx.createBiquadFilter(); sBody.type='lowshelf'; sBody.frequency.value=250; sBody.gain.value=6;
    sGain=actx.createGain(); sGain.gain.value=0;
    src.connect(sFilt); sFilt.connect(sBody); sBody.connect(sGain); sGain.connect(actx.destination); src.start();
  }catch(e){actx=null;}
}
function soundUpdate(speed,pressure){
  if(!actx||!sGain) return; const now=actx.currentTime;
  const t=TOOLS.find(x=>x.id===activeTool())||TOOLS[0]; const dry=settings.dry;
  const v=Math.min(1,speed*0.9);
  const g=settings.sound? v*(0.3+0.7*pressure)*t.snd[2]*(0.55+0.7*dry)*0.32 : 0;
  sGain.gain.setTargetAtTime(g,now,0.035);
  sFilt.frequency.setTargetAtTime(t.snd[0]*(1+dry*0.9)*(0.75+0.5*v),now,0.05);
  sFilt.Q.setTargetAtTime(t.snd[1]*(1+dry*0.5),now,0.1);
}
function soundStop(){ if(actx&&sGain) sGain.gain.setTargetAtTime(0,actx.currentTime,0.06); }

/* ---------------- Entrada ---------------- */
const canvas=renderer.domElement;
const pointers=new Map();
let mode=null; // 'sculpt' | 'rotate' | 'pinch'
let shiftDown=false, altDown=false;
let last=null; // {sx,sy,P,time}
let lastHit=null;
let pinchStart=null;
let undoStack=[], redoStack=[], strokeSnap=null, strokeDabs=0;
const ndc=new THREE.Vector2(), rc=new THREE.Raycaster(), inv=new THREE.Matrix4();

function activeTool(){ return shiftDown?'smooth':tool; }
function objRay(cx,cy){
  const r=canvas.getBoundingClientRect();
  ndc.set((cx-r.left)/r.width*2-1,-((cy-r.top)/r.height)*2+1);
  rc.setFromCamera(ndc,camera); inv.copy(group.matrixWorld).invert();
  const o=rc.ray.origin.clone().applyMatrix4(inv), d=rc.ray.direction.clone().transformDirection(inv);
  return {o:[o.x,o.y,o.z],d:[d.x,d.y,d.z]};
}
function pick(cx,cy){
  const ray=objRay(cx,cy); const h=raycast(ray.o,ray.d); if(!h) return {hit:null,ray};
  const P=[ray.o[0]+ray.d[0]*h.t,ray.o[1]+ray.d[1]*h.t,ray.o[2]+ray.d[2]*h.t];
  let nx=0,ny=0,nz=0; for(let k=0;k<3;k++){const v=idx[h.f*3+k]*3; nx+=nor[v];ny+=nor[v+1];nz+=nor[v+2];}
  const l=Math.hypot(nx,ny,nz)||1; return {hit:{P,N:[nx/l,ny/l,nz/l],t:h.t},ray};
}
function worldRadius(P){
  const wp=new THREE.Vector3(P[0],P[1],P[2]).applyMatrix4(group.matrixWorld);
  const dd=camera.position.distanceTo(wp);
  return settings.size*2*dd*Math.tan(camera.fov*Math.PI/360)/canvas.clientHeight;
}
function showCursor(hit,r){
  if(!hit){cursor.visible=false;return;}
  const wp=new THREE.Vector3(...hit.P).applyMatrix4(group.matrixWorld);
  const wn=new THREE.Vector3(...hit.N).transformDirection(group.matrixWorld);
  cursor.position.copy(wp).addScaledVector(wn,0.004);
  cursor.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),wn);
  cursor.scale.setScalar(r); cursor.visible=true;
  ring.material.color.set(altDown&&activeTool()!=='smooth'?0x9fc3e6:(shiftDown?0xd6e7c9:0xf3e8d8));
}
function pressureOf(e){ if(e.pointerType==='mouse') return 1; const p=e.pressure||0.5; return Math.pow(Math.min(1,Math.max(0.05,p)),0.8); }
const pbar=document.getElementById('pbar');

canvas.addEventListener('pointerdown',e=>{
  canvas.focus({preventScroll:true});
  initAudio(); if(actx&&actx.state==='suspended') actx.resume();
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){ // gesto com dois dedos
    if(mode==='sculpt') endStroke();
    mode='pinch'; const pts=[...pointers.values()];
    pinchStart={d:Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y),dist:camDist,mx:(pts[0].x+pts[1].x)/2,my:(pts[0].y+pts[1].y)/2};
    return;
  }
  if(pointers.size>2) return;
  const {hit}=pick(e.clientX,e.clientY);
  if(e.button===0 && hit){
    mode='sculpt'; strokeSnap=new Float32Array(pos); strokeDabs=0;
    strokeSeed=[Math.random()*100,Math.random()*100,Math.random()*100];
    lastHit=hit; last={sx:e.clientX,sy:e.clientY,P:hit.P.slice(),time:performance.now(),acc:1e9};
    stroke(e,true);
  } else { mode='rotate'; yawVel=0; last={sx:e.clientX,sy:e.clientY,time:performance.now()}; }
});
canvas.addEventListener('pointermove',e=>{
  if(pointers.has(e.pointerId)) pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(mode==='pinch'&&pointers.size>=2){
    const pts=[...pointers.values()]; const d=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
    camDist=Math.min(10,Math.max(1.6,pinchStart.dist*pinchStart.d/Math.max(d,1)));
    const mx=(pts[0].x+pts[1].x)/2,my=(pts[0].y+pts[1].y)/2;
    yaw+=(mx-pinchStart.mx)*0.008; pitch=Math.min(1.25,Math.max(-0.9,pitch+(my-pinchStart.my)*0.006));
    pinchStart.mx=mx; pinchStart.my=my; return;
  }
  if(mode==='rotate'){
    const dx=e.clientX-last.sx, dy=e.clientY-last.sy; const now=performance.now();
    yaw+=dx*0.008; pitch=Math.min(1.25,Math.max(-0.9,pitch+dy*0.006));
    yawVel=yawVel*0.5+(dx*0.008)*0.5/Math.max(1,(now-last.time)/16);
    last.sx=e.clientX; last.sy=e.clientY; last.time=now; return;
  }
  if(mode==='sculpt'){ stroke(e,false); return; }
  if(e.pointerType!=='touch'){ const {hit}=pick(e.clientX,e.clientY); showCursor(hit,hit?worldRadius(hit.P):0); }
});
function endPointer(e){
  pointers.delete(e.pointerId);
  if(mode==='sculpt') endStroke();
  if(mode==='pinch' && pointers.size<2){ mode=null; pointers.clear(); return; }
  if(pointers.size===0){ mode=null; pbar.style.height='0%'; }
}
canvas.addEventListener('pointerup',endPointer);
canvas.addEventListener('pointercancel',endPointer);
canvas.addEventListener('pointerleave',e=>{ if(!mode) cursor.visible=false; });
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('wheel',e=>{ e.preventDefault(); camDist=Math.min(10,Math.max(1.6,camDist*Math.exp(e.deltaY*0.0012))); },{passive:false});

function stroke(e,first){
  const press=pressureOf(e); pbar.style.height=(press*100).toFixed(0)+'%';
  const tl=activeTool(); const inv=altDown;
  const s=settings.strength*(0.25+0.75*press);
  const sx=first?e.clientX:last.sx+(e.clientX-last.sx)*0.65;
  const sy=first?e.clientY:last.sy+(e.clientY-last.sy)*0.65;
  const now=performance.now();
  const pxDist=first?0:Math.hypot(sx-last.sx,sy-last.sy);
  const pxR=settings.size*(e.pointerType==='pen'?(0.7+0.3*press):1);
  const steps=first?1:Math.min(10,Math.max(1,Math.ceil(pxDist/Math.max(2,pxR*0.12))));
  let hitShown=null, rShown=0;
  for(let st=1;st<=steps;st++){
    const ax=first?sx:last.sx+(sx-last.sx)*st/steps, ay=first?sy:last.sy+(sy-last.sy)*st/steps;
    const {hit,ray}=pick(ax,ay);
    let P,N;
    if(hit){P=hit.P;N=hit.N;lastHit=hit;}
    else { // continua no plano do último ponto (passa da silhueta sem perder o gesto)
      const nP=last.P; const den=-(ray.d[0]*ray.d[0]+ray.d[1]*ray.d[1]+ray.d[2]*ray.d[2]);
      const tt=-((nP[0]-ray.o[0])*ray.d[0]+(nP[1]-ray.o[1])*ray.d[1]+(nP[2]-ray.o[2])*ray.d[2])/den;
      P=[ray.o[0]+ray.d[0]*tt,ray.o[1]+ray.d[1]*tt,ray.o[2]+ray.d[2]*tt]; N=lastHit.N;
    }
    const r=worldRadius(P)*(pxR/settings.size);
    const dx=P[0]-last.P[0],dy=P[1]-last.P[1],dz=P[2]-last.P[2]; const ml=Math.hypot(dx,dy,dz);
    const spacing=r*(tl==='rake'?0.08:0.12);
    if(first||ml>=spacing){
      let T=ml>1e-6?[dx/ml,dy/ml,dz/ml]:(last.T||[1,0,0]);
      if(first){const cr=new THREE.Vector3(1,0,0).transformDirection(inv0()); T=[cr.x,cr.y,cr.z];}
      applyDab(P,T,r,s,tl,inv,first?0:ml);
      strokeDabs++; last.P=P; last.T=T;
    }
    hitShown={P,N}; rShown=r;
  }
  if(hitShown) showCursor(hitShown,rShown);
  const dt=Math.max(1,now-last.time);
  soundUpdate(first?0:pxDist/dt,press);
  last.sx=sx; last.sy=sy; last.time=now;
}
function inv0(){ return new THREE.Matrix4().copy(group.matrixWorld).invert(); }
function endStroke(){
  soundStop();
  if(strokeDabs>0){ undoStack.push(strokeSnap); if(undoStack.length>30) undoStack.shift(); redoStack=[]; buildGrid(); }
  strokeSnap=null; mode=null; refreshUndo();
}
function restore(arr){ pos.set(arr); recomputeAll(); buildGrid(); }
function undo(){ if(!undoStack.length) return; redoStack.push(new Float32Array(pos)); restore(undoStack.pop()); refreshUndo(); flash('Desfeito'); }
function redo(){ if(!redoStack.length) return; undoStack.push(new Float32Array(pos)); restore(redoStack.pop()); refreshUndo(); flash('Refeito'); }
function refreshUndo(){ document.getElementById('undo').disabled=!undoStack.length; document.getElementById('redo').disabled=!redoStack.length; }

/* ---------------- Teclado ---------------- */
window.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.key==='Shift') shiftDown=true;
  if(e.key==='Alt'){ altDown=true; e.preventDefault(); }
  const k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&k==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
  if((e.ctrlKey||e.metaKey)&&k==='y'){ e.preventDefault(); redo(); return; }
  if(e.ctrlKey||e.metaKey) return;
  if(/^[1-6]$/.test(e.key)){ setTool(TOOLS[+e.key-1].id); flash(TOOLS[+e.key-1].name); }
  if(e.key==='['){ setSize(settings.size/1.15); }
  if(e.key===']'){ setSize(settings.size*1.15); }
  if(k==='x'){ toggle('tSym','sym'); flash(settings.sym?'Simetria ligada':'Simetria desligada'); }
});
window.addEventListener('keyup',e=>{ if(e.key==='Shift') shiftDown=false; if(e.key==='Alt') altDown=false; });
window.addEventListener('blur',()=>{shiftDown=false;altDown=false;});

/* ---------------- Painéis ---------------- */
const $=id=>document.getElementById(id);
function paintRange(el){ const p=(el.value-el.min)/(el.max-el.min)*100; el.style.setProperty('--p',p+'%'); }
function setSize(v){ settings.size=Math.round(Math.min(240,Math.max(12,v))); $('size').value=settings.size; $('sizeOut').textContent=settings.size+' px'; paintRange($('size')); }
$('size').addEventListener('input',e=>setSize(+e.target.value));
$('strength').addEventListener('input',e=>{ settings.strength=e.target.value/100; $('strOut').textContent=e.target.value+'%'; paintRange(e.target); });
function setDry(v){
  settings.dry=v/100; clayMat.uniforms.uDry.value=settings.dry; paintRange($('dry'));
  const sp=$('ticks').children; const i=settings.dry<0.34?0:settings.dry<0.67?1:2;
  for(let j=0;j<3;j++) sp[j].className=j===i?'on':'';
}
$('dry').addEventListener('input',e=>setDry(+e.target.value));
function toggle(id,key){ settings[key]=!settings[key]; $(id).setAttribute('aria-checked',settings[key]); if(key==='sound'&&!settings.sound) soundStop(); }
$('tSym').onclick=()=>toggle('tSym','sym');
$('tVol').onclick=()=>toggle('tVol','vol');
$('tSound').onclick=()=>toggle('tSound','sound');
$('undo').onclick=undo; $('redo').onclick=redo;
$('newBlock').onclick=()=>{ undoStack.push(new Float32Array(pos)); redoStack=[]; resetForm(false); refreshUndo(); flash('Bloco novo'); };
$('newSample').onclick=()=>{ undoStack.push(new Float32Array(pos)); redoStack=[]; resetForm(true); refreshUndo(); flash('Exemplo carregado'); };
$('settingsBtn').onclick=()=>{ const o=$('side').classList.toggle('open'); $('settingsBtn').setAttribute('aria-expanded',o); };

const sws=$('swatches');
function hexLin(h){ const n=parseInt(h.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255].map(c=>Math.pow(c/255,2.2)); }
function setClay(i){ const c=CLAYS[i]; clayMat.uniforms.uColor.value.set(...hexLin(c.hex)); $('swname').textContent=c.name; [...sws.children].forEach((b,j)=>b.setAttribute('aria-pressed',j===i)); }
CLAYS.forEach((c,i)=>{ const b=document.createElement('button'); b.className='sw'; b.style.background=c.hex; b.setAttribute('aria-label',c.name); b.onclick=()=>setClay(i); sws.appendChild(b); });

let flashT=0; function flash(t){ const m=$('mode'); m.textContent=t; m.classList.add('show'); clearTimeout(flashT); flashT=setTimeout(()=>m.classList.remove('show'),900); }

/* ---------------- Forma inicial ---------------- */
function rng(seed){ let s=seed>>>0; return ()=>{ s=Math.imul(s^(s>>>15),2246822507)^Math.imul(s^(s>>>13),3266489909); s^=s>>>16; return (s>>>0)/4294967296; }; }
function surfacePoint(dx,dy,dz){
  const l=Math.hypot(dx,dy,dz); const d=[-dx/l,-dy/l,-dz/l]; const o=[dx/l*3,dy/l*3,dz/l*3];
  const h=raycast(o,d); if(!h) return null; return [o[0]+d[0]*h.t,o[1]+d[1]*h.t,o[2]+d[2]*h.t];
}
function resetForm(sample){
  for(let i=0;i<nV;i++){ const x=basePos[i*3],y=basePos[i*3+1],z=basePos[i*3+2];
    const sy = y<0 ? 0.98 : 1.08; pos[i*3]=x*0.94*(1-0.08*Math.max(0,y)); pos[i*3+1]=y*sy; pos[i*3+2]=z*0.98; }
  recomputeAll(); buildGrid();
  if(sample){
    const R=rng(7); const keep={...settings}; settings.sym=false; settings.vol=true; settings.dry=0.15;
    strokeSeed=[3.1,7.7,1.3];
    for(let n=0;n<34;n++){ const a=R()*Math.PI*2, y=R()*1.5-0.55; const P=surfacePoint(Math.cos(a),y,Math.sin(a)); if(!P) continue;
      applyDab(P,[Math.sin(a),0.3,-Math.cos(a)],0.2+R()*0.16,0.65,'clay',false,0); }
    for(let n=0;n<7;n++){ const a=R()*Math.PI*2, y=R()*1.2-0.3; let ang=a;
      for(let s=0;s<9;s++){ const P=surfacePoint(Math.cos(ang),y+s*0.02,Math.sin(ang)); if(!P) break; applyDab(P,[-Math.sin(ang),0.1,Math.cos(ang)],0.2,0.6,'thumb',false,0.04); ang+=0.06; } }
    let ang=2.4; for(let s=0;s<26;s++){ const P=surfacePoint(Math.cos(ang),0.25+s*0.012,Math.sin(ang)); if(!P) break; applyDab(P,[-Math.sin(ang),0.25,Math.cos(ang)],0.17,0.7,'rake',false,0.02); ang+=0.035; }
    ang=-0.2; for(let s=0;s<16;s++){ const P=surfacePoint(Math.cos(ang),-0.1-s*0.01,Math.sin(ang)); if(!P) break; applyDab(P,[-Math.sin(ang),-0.2,Math.cos(ang)],0.09,0.8,'carve',false,0.02); ang+=0.05; }
    settings.sym=keep.sym; settings.dry=keep.dry; settings.vol=keep.vol;
    recomputeAll(); buildGrid();
  }
}

/* ---------------- Loop ---------------- */
let dirty=true;
function frame(){
  if(mode!=='rotate'&&mode!=='pinch'){ yaw+=yawVel; yawVel*=0.94; if(Math.abs(yawVel)<1e-5) yawVel=0; }
  updateCamera();
  if(dirty){ posAttr.needsUpdate=true; norAttr.needsUpdate=true; cavAttr.needsUpdate=true; dirty=false; }
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}

setSize(70); paintRange($('strength')); setDry(18); setClay(0);
resize(); resetForm(true); updateCamera(); requestAnimationFrame(frame);
})();
</script>
